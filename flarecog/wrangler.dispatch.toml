# FlareCog Dispatch Worker Configuration
# This worker runs in the Workers for Platforms dispatch namespace

name = "flarecog-tenant-worker"
main = "src/dispatch-worker.ts"
compatibility_date = "2024-11-01"
account_id = "d1fcd8dbbd35aec43e5499200f6baede"

# Deploy to dispatch namespace
dispatch_namespace = "flarecog"

# ==================== Durable Objects ====================

[[durable_objects.bindings]]
name = "ATOMSPACE"
class_name = "AtomSpace"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "MIND_AGENT"
class_name = "MindAgent"
script_name = "flarecog"

# ==================== KV Namespaces ====================

[[kv_namespaces]]
binding = "ATOM_CACHE"
id = "5c8063c1ce494e978e0e84a57867dcc0"

[[kv_namespaces]]
binding = "COORDINATION_CACHE"
id = "f8426d8c65f1496a8fa7ca6f91ab272c"

# ==================== Workers AI ====================

[ai]
binding = "AI"

# ==================== Environment Variables ====================

[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# ==================== Limits ====================

limits = { cpu_ms = 30000 }

[placement]
mode = "smart"
