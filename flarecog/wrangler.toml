# FlareCog v6.0 Production Configuration
name = "flarecog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "d1fcd8dbbd35aec43e5499200f6baede"

# ==================== Durable Objects ====================

[[durable_objects.bindings]]
name = "ATOMSPACE"
class_name = "AtomSpace"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "MIND_AGENT"
class_name = "MindAgent"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "CRDT_ATOMSPACE_COORDINATOR"
class_name = "CRDTAtomSpaceCoordinator"
script_name = "flarecog"

# ==================== KV Namespaces ====================

[[kv_namespaces]]
binding = "STORAGE_METADATA"
id = "f8426d8c65f1496a8fa7ca6f91ab272c"

[[kv_namespaces]]
binding = "TASK_RESULTS"
id = "5267bffe50514722a43992254079523e"

[[kv_namespaces]]
binding = "TENANT_REGISTRY"
id = "55c57615ccc447b298dbcb072bbf18ca"

[[kv_namespaces]]
binding = "USAGE_TRACKER"
id = "6a8f8b34864248399ef393297b5f4d50"

[[kv_namespaces]]
binding = "SHARED_KNOWLEDGE"
id = "71ef302917254218a08f4b77b1860efe"

[[kv_namespaces]]
binding = "KV_WARM_STORAGE"
id = "ed860d79d02444feb287f2f56ce3d992"

# ==================== R2 Storage ====================

[[r2_buckets]]
binding = "R2_COLD_STORAGE"
bucket_name = "flarecog-cold-storage"

# ==================== Queues ====================

[[queues.producers]]
binding = "COGNITIVE_QUEUE"
queue = "flarecog-cognitive-queue"

[[queues.consumers]]
queue = "flarecog-cognitive-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "flarecog-dlq"

[[queues.producers]]
binding = "PRIORITY_QUEUE"
queue = "flarecog-priority-queue"

[[queues.consumers]]
queue = "flarecog-priority-queue"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "flarecog-dlq"

[[queues.producers]]
binding = "INFERENCE_QUEUE"
queue = "flarecog-inference-queue"

[[queues.consumers]]
queue = "flarecog-inference-queue"
max_batch_size = 10
max_batch_timeout = 60
max_retries = 3
dead_letter_queue = "flarecog-dlq"

[[queues.producers]]
binding = "CONSOLIDATION_QUEUE"
queue = "flarecog-consolidation-queue"

[[queues.consumers]]
queue = "flarecog-consolidation-queue"
max_batch_size = 20
max_batch_timeout = 120
max_retries = 2
dead_letter_queue = "flarecog-dlq"

[[queues.producers]]
binding = "COORDINATION_QUEUE"
queue = "flarecog-coordination-queue"

[[queues.consumers]]
queue = "flarecog-coordination-queue"
max_batch_size = 10
max_batch_timeout = 60
max_retries = 3
dead_letter_queue = "flarecog-dlq"

# ==================== Workers AI ====================

[ai]
binding = "AI"

# ==================== Environment Variables ====================

[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
ECAN_DECAY_RATE = "0.1"
ECAN_SPREAD_FRACTION = "0.5"
SYNERGY_CYCLE_TIMEOUT = "30000"
ECHO_AWARENESS_THRESHOLD = "0.7"
MAX_ATOMSPACES_PER_TENANT = "100"
DEFAULT_ATOMSPACE_QUOTA = "10000000"
HOT_TIER_STI_THRESHOLD = "80"
WARM_TIER_STI_THRESHOLD = "40"
COLD_TIER_STI_THRESHOLD = "10"
EVICTION_AGE_DAYS = "7"

# ==================== Limits and Performance ====================

limits = { cpu_ms = 50000 }

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1.0
