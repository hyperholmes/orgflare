name: Deploy FlareCog to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-main-worker:
    name: Deploy Main Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'flarecog/pnpm-lock.yaml'
      
      - name: Install dependencies
        working-directory: ./flarecog
        run: pnpm install --frozen-lockfile
      
      - name: Deploy to Cloudflare Workers
        working-directory: ./flarecog
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Upload Wrangler Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: /home/runner/.config/.wrangler/logs/
      
      - name: Deployment Summary
        run: |
          echo "✅ FlareCog main worker deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`o9nn/flarecog\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL: https://flarecog.d-d1f.workers.dev" >> $GITHUB_STEP_SUMMARY

  deploy-dispatch-workers:
    name: Deploy Dispatch Workers
    runs-on: ubuntu-latest
    needs: deploy-main-worker
    permissions:
      contents: read
    
    strategy:
      matrix:
        tenant:
          - name: demo-tenant
            id: demo-001
          - name: research-tenant
            id: research-001
          - name: production-tenant
            id: prod-001
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'flarecog/pnpm-lock.yaml'
      
      - name: Install dependencies
        working-directory: ./flarecog
        run: pnpm install --frozen-lockfile
      
      - name: Deploy ${{ matrix.tenant.name }}
        working-directory: ./flarecog
        run: |
          pnpm wrangler deploy src/dispatch-worker.ts \
            --name ${{ matrix.tenant.name }} \
            --dispatch-namespace flarecog \
            --compatibility-date 2024-11-01 \
            --var TENANT_ID:${{ matrix.tenant.id }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Upload Wrangler Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log-${{ matrix.tenant.name }}
          path: /home/runner/.config/.wrangler/logs/
      
      - name: Tenant Deployment Summary
        run: |
          echo "✅ Deployed \`${{ matrix.tenant.name }}\` (ID: \`${{ matrix.tenant.id }}\`)" >> $GITHUB_STEP_SUMMARY

  notify-completion:
    name: Notify Deployment Completion
    runs-on: ubuntu-latest
    needs: [deploy-main-worker, deploy-dispatch-workers]
    if: always()
    
    steps:
      - name: Final Summary
        run: |
          echo "# 🎉 FlareCog v6.0 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All workers have been deployed to Cloudflare's global network." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Main Worker:** https://flarecog.d-d1f.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Dispatch Namespace:** \`flarecog\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tenant Workers:** 3 deployed" >> $GITHUB_STEP_SUMMARY
