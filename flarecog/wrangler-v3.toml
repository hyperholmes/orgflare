# FlareCog v3.0 Configuration
# Complete OpenCog-CloudFlare Integration
name = "flarecog"
main = "src/index-enhanced-v3.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects
[[durable_objects.bindings]]
name = "ATOMSPACE"
class_name = "AtomSpace"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "MIND_AGENT"
class_name = "MindAgent"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "STORAGE_NODE"
class_name = "StorageNode"
script_name = "flarecog"

[[durable_objects.bindings]]
name = "WS_MANAGER"
class_name = "CognitiveWebSocketManager"
script_name = "flarecog"

# R2 Bucket for Cold Storage
[[r2_buckets]]
binding = "ATOMSPACE_COLD_STORAGE"
bucket_name = "flarecog-cold-storage"
preview_bucket_name = "flarecog-cold-storage-preview"

# D1 Database for Global Coordination
[[d1_databases]]
binding = "COORDINATION_DB"
database_name = "flarecog-coordination"
database_id = "YOUR_D1_DATABASE_ID"

# KV Namespace for Caching and Metadata
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# Workers AI Binding
[ai]
binding = "AI"

# Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Environment Variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
MAX_ATOMSPACES_PER_TENANT = "100"
DEFAULT_ATOMSPACE_QUOTA = "10000000"
ENABLE_AI_ENHANCEMENT = "true"
ENABLE_DISTRIBUTED_SYNC = "true"
ENABLE_WEBSOCKET_STREAMING = "true"

# Development Environment
[env.development]
name = "flarecog-dev"
vars = { 
	ENVIRONMENT = "development", 
	LOG_LEVEL = "debug",
	ENABLE_AI_ENHANCEMENT = "true",
	ENABLE_DISTRIBUTED_SYNC = "false",
	ENABLE_WEBSOCKET_STREAMING = "true"
}

[env.development.d1_databases]
binding = "COORDINATION_DB"
database_name = "flarecog-coordination-dev"
database_id = "YOUR_DEV_D1_DATABASE_ID"

# Staging Environment
[env.staging]
name = "flarecog-staging"
vars = { 
	ENVIRONMENT = "staging", 
	LOG_LEVEL = "info",
	ENABLE_AI_ENHANCEMENT = "true",
	ENABLE_DISTRIBUTED_SYNC = "true",
	ENABLE_WEBSOCKET_STREAMING = "true"
}

[env.staging.d1_databases]
binding = "COORDINATION_DB"
database_name = "flarecog-coordination-staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"

# Limits and Performance
limits = { cpu_ms = 50000 }

[placement]
mode = "smart"

# Observability
[observability]
enabled = true
